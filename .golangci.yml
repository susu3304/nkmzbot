version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - unnamedResult
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G404
    govet:
      disable:
        - shadow
      enable-all: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: _test\.go
      - linters:
          - errcheck
        text: Error return value.*is not checked
      - linters:
          - gosec
        text: G114
      - linters:
          - staticcheck
        text: SA1029
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - govet
        text: fieldalignment
      - linters:
          - gocritic
        text: exitAfterDefer
      - linters:
          - revive
        text: exported
      - linters:
          - gocritic
        text: paramTypeCombine|httpNoBody|commentedOutCode|ifElseChain|emptyStringTest|regexpSimplify|builtinShadow
      - linters:
          - unused
        text: handleCallback
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
